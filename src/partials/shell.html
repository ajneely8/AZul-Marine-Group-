<!DOCTYPE html>
<html lang="en" class="no-js{{introClass}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{meta.title}}</title>
  <meta name="description" content="{{meta.description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="theme-color" content="#0b2545">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:title" content="{{meta.title}}">
  <meta property="og:description" content="{{meta.description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{meta.title}}">
  <meta name="twitter:description" content="{{meta.description}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <link rel="icon" href="assets/brand/logo.svg" type="image/svg+xml">
  <link rel="icon" href="assets/brand/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    (function (d) {
      d.classList.remove('no-js');
      var play = true;
      try {
        var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        var reload = nav ? nav.type === 'reload' : (performance.navigation && performance.navigation.type === 1);
        var seen = window.sessionStorage.getItem('amg-intro') === '1';
        play = !!reload || !seen;
      } catch (e) { play = true; }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { play = false; }
      if (!play) { d.classList.remove('intro-pending'); }
    })(document.documentElement);
  </script>
  {{jsonld}}
</head>
<body class="{{bodyClass}}">
  {{logoSymbol}}
  <a class="skip-link" href="#main">Skip to main content</a>
  {{intro}}
  {{header}}
  <main id="main" tabindex="-1">
{{body}}
  </main>
  {{footer}}
  <script src="assets/js/main.js" defer></script>
  {{extraScripts}}
</body>
</html>
